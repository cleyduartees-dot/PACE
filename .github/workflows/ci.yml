name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PACE and test deps
        run: pip install . pytest
      - name: Run the test suite
        run: python -m pytest -q
      - name: Validate PACE's own .pace/ instance
        run: pace doctor
